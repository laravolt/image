name: Docker Build Check

on:
  pull_request:
    paths:
      - src/**
      - .github/workflows/**
      - .github/scripts/**
  # The update-base-image workflow dispatches this on its PR branch, because a
  # PR opened with GITHUB_TOKEN does not trigger pull_request workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The docker driver lets the dev image build on the image loaded above.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker

      - name: Build (no push)
        uses: docker/build-push-action@v7.4.0
        with:
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            BASE_VARIATION=frankenphp-debian
          context: src/.
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: laravolt-image-check:php${{ matrix.php-version }}

      - name: Smoke test
        run: .github/scripts/smoke-test.sh laravolt-image-check:php${{ matrix.php-version }} ${{ matrix.php-version }}

      - name: Install Trivy
        run: .github/scripts/install-trivy.sh

      - name: Scan for vulnerabilities
        run: .github/scripts/scan.sh laravolt-image-check:php${{ matrix.php-version }}

      - name: Run laravel-starter-kit on the image
        if: matrix.php-version == '8.5'
        run: .github/scripts/app-test.sh laravolt-image-check:php${{ matrix.php-version }}

      - name: Build the dev image on top (no push)
        uses: docker/build-push-action@v7.4.0
        with:
          build-args: |
            BASE_IMAGE=laravolt-image-check:php${{ matrix.php-version }}
          context: src/.
          file: src/dev.Dockerfile
          platforms: linux/amd64
          pull: false
          push: false
          load: true
          tags: laravolt-image-check:php${{ matrix.php-version }}-dev

      - name: Smoke test the dev image
        run: |
          docker run --rm --entrypoint bun laravolt-image-check:php${{ matrix.php-version }}-dev --version
          docker run --rm --entrypoint php laravolt-image-check:php${{ matrix.php-version }}-dev -m | grep -qx xdebug
          # Starts with no project mounted (AUTORUN_LARAVEL_SKIP_IF_NOT_FOUND) and answers its health check.
          cid=$(docker run -d -p 127.0.0.1:8081:8080 laravolt-image-check:php${{ matrix.php-version }}-dev)
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/healthcheck && break; sleep 1; done
          curl -fsS http://127.0.0.1:8081/healthcheck || { docker logs "$cid"; exit 1; }
          docker rm -f "$cid"
