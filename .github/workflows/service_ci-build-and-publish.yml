on:
  workflow_call:
    inputs:
      checkout-type:
        required: true
        type: string

jobs:
  docker-publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.5"
    steps:
      - name: Get latest stable release
        if: inputs.checkout-type == 'latest-stable'
        id: latest-stable-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "LATEST_STABLE_VERSION=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.checkout-type == 'latest-stable' && steps.latest-stable-version.outputs.LATEST_STABLE_VERSION || github.ref }}

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Set Docker tags for branch builds
        if: inputs.checkout-type == 'branch'
        run: |
          echo "DOCKER_TAGS=laravoltdev/image:php${{ matrix.php-version }}-ci" >> $GITHUB_ENV

      - name: Set Docker tags for releases
        if: inputs.checkout-type == 'latest-stable'
        run: |
          VERSION="${{ steps.latest-stable-version.outputs.LATEST_STABLE_VERSION }}"
          echo "DOCKER_TAGS=laravoltdev/image:php${{ matrix.php-version }}-ci,laravoltdev/image:php${{ matrix.php-version }}-ci-${VERSION}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: src/.
          file: src/ci.Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
