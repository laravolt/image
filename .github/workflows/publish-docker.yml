name: Docker Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - .github/workflows/**
  release:
    types: [released]

jobs:
  frankenphp-debian:
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      php-variation: frankenphp-debian
      serversideup-version: v4.4.0
      checkout-type: ${{ github.event_name == 'release' && 'latest-stable' || 'branch' }}
    secrets: inherit
