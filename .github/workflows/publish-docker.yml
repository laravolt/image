name: Docker Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - .github/workflows/**
      - .github/scripts/**
  release:
    types: [released]
  # Weekly rebuild of the plain tags, so Debian security updates and a
  # re-published base image reach them without a change in this repo.
  # Versioned tags (*-v1.2.0) are only built from a release.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  frankenphp-debian:
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      php-variation: frankenphp-debian
      checkout-type: ${{ github.event_name == 'release' && 'latest-stable' || 'branch' }}
    secrets: inherit

  ci:
    uses: ./.github/workflows/service_ci-build-and-publish.yml
    with:
      checkout-type: ${{ github.event_name == 'release' && 'latest-stable' || 'branch' }}
    secrets: inherit
