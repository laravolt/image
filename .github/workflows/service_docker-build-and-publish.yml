on:
  workflow_call:
    inputs:
      php-variation:
        required: true
        type: string
      checkout-type:
        required: true
        type: string

jobs:
  docker-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - name: Get latest stable release
        if: inputs.checkout-type == 'latest-stable'
        id: latest-stable-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "LATEST_STABLE_VERSION=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.checkout-type == 'latest-stable' && steps.latest-stable-version.outputs.LATEST_STABLE_VERSION || github.ref }}

      - name: Set Docker tags
        env:
          PHP: ${{ matrix.php-version }}
          VARIATION: ${{ inputs.php-variation }}
          VERSION: ${{ steps.latest-stable-version.outputs.LATEST_STABLE_VERSION }}
        run: |
          image=laravoltdev/image
          runtime="$image:php$PHP-$VARIATION,$image:php$PHP-base,$image:php$PHP-prod"
          dev="$image:php$PHP-dev"
          if [ -n "$VERSION" ]; then
            runtime="$runtime,$image:php$PHP-$VARIATION-$VERSION,$image:php$PHP-base-$VERSION,$image:php$PHP-prod-$VERSION"
            dev="$dev,$image:php$PHP-dev-$VERSION"
            if [ "$PHP" = "8.5" ]; then runtime="$runtime,$image:latest"; fi
          fi
          echo "RUNTIME_TAGS=$runtime" >> "$GITHUB_ENV"
          echo "DEV_TAGS=$dev" >> "$GITHUB_ENV"
          # The first tag is the one the dev image builds on.
          echo "RUNTIME_IMAGE=${runtime%%,*}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Test before anything is pushed: a broken build must not replace a working tag.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7.4.0
        with:
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            BASE_VARIATION=${{ inputs.php-variation }}
          context: src/.
          platforms: linux/amd64
          pull: true
          load: true
          tags: laravolt-image-test
          cache-from: type=gha,scope=php${{ matrix.php-version }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php-version }}

      - name: Smoke test
        run: .github/scripts/smoke-test.sh laravolt-image-test ${{ matrix.php-version }}

      - name: Install Trivy
        run: .github/scripts/install-trivy.sh

      # A critical vulnerability that has a fix stops the push.
      - name: Scan for vulnerabilities
        run: .github/scripts/scan.sh laravolt-image-test trivy-php${{ matrix.php-version }}.sarif

      - name: Upload the scan to the Security tab
        if: always() && hashFiles(format('trivy-php{0}.sarif', matrix.php-version)) != ''
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: trivy-php${{ matrix.php-version }}.sarif
          category: trivy-php${{ matrix.php-version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push the runtime image
        uses: docker/build-push-action@v7.4.0
        with:
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            BASE_VARIATION=${{ inputs.php-variation }}
          context: src/.
          platforms: linux/amd64,linux/arm64/v8
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.RUNTIME_TAGS }}
          cache-from: type=gha,scope=php${{ matrix.php-version }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php-version }}

      - name: Build and push the dev image
        uses: docker/build-push-action@v7.4.0
        with:
          build-args: |
            BASE_IMAGE=${{ env.RUNTIME_IMAGE }}
          context: src/.
          file: src/dev.Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.DEV_TAGS }}
