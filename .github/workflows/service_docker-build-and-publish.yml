on:
  workflow_call:
    inputs:
      php-variation:
        required: true
        type: string
      serversideup-version:
        required: true
        type: string
      checkout-type:
        required: true
        type: string

jobs:
  docker-publish:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"
          - "8.4"
    steps:
      - name: Get branch name
        if: inputs.checkout-type == 'branch'
        id: branch-name
        uses: tj-actions/branch-names@v8

      - name: Checkout branch
        if: inputs.checkout-type == 'branch'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch-name.outputs.current_branch }}

      - name: Get latest stable release
        if: inputs.checkout-type == 'latest-stable'
        id: latest-stable-version
        run: |
          echo "LATEST_STABLE_VERSION=$(curl --silent --header "Accept: application/vnd.github.v3+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r '.tag_name')" >> $GITHUB_OUTPUT

      - name: Checkout latest stable tag
        if: inputs.checkout-type == 'latest-stable'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.latest-stable-version.outputs.LATEST_STABLE_VERSION }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Docker tags for branch builds
        if: inputs.checkout-type == 'branch'
        run: |
          echo "DOCKER_TAGS=laravoltdev/image:php${{ matrix.php-version }}-${{ inputs.php-variation }},laravoltdev/image:php${{ matrix.php-version }}-base" >> $GITHUB_ENV

      - name: Set Docker tags for releases
        if: inputs.checkout-type == 'latest-stable'
        run: |
          VERSION="${{ steps.latest-stable-version.outputs.LATEST_STABLE_VERSION }}"
          TAGS="laravoltdev/image:php${{ matrix.php-version }}-${{ inputs.php-variation }},laravoltdev/image:php${{ matrix.php-version }}-${{ inputs.php-variation }}-${VERSION},laravoltdev/image:php${{ matrix.php-version }}-base,laravoltdev/image:php${{ matrix.php-version }}-base-${VERSION}"
          if [ "${{ matrix.php-version }}" = "8.4" ]; then
            TAGS="$TAGS,laravoltdev/image:latest"
          fi
          echo "DOCKER_TAGS=$TAGS" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            BASE_VARIATION=${{ inputs.php-variation }}
            SERVERSIDEUP_VERSION=${{ inputs.serversideup-version }}
          context: src/.
          platforms: |
            linux/amd64
            linux/arm64/v8
          pull: true
          push: true
          tags: ${{ env.DOCKER_TAGS }}
