on:
  workflow_call:
    inputs:
      php-variation:
        required: true
        type: string
      checkout-type:
        required: true
        type: string

jobs:
  docker-publish:
    runs-on: ubuntu-24.04
    # DOCKER_HUB_* secrets live in the docker-hub environment (reviewers required).
    environment: docker-hub
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - name: Get latest stable release
        if: inputs.checkout-type == 'latest-stable'
        id: latest-stable-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "LATEST_STABLE_VERSION=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.checkout-type == 'latest-stable' && steps.latest-stable-version.outputs.LATEST_STABLE_VERSION || github.ref }}

      - name: Set Docker tags
        env:
          PHP: ${{ matrix.php-version }}
          VARIATION: ${{ inputs.php-variation }}
          VERSION: ${{ steps.latest-stable-version.outputs.LATEST_STABLE_VERSION }}
        run: |
          image=laravoltdev/image
          runtime="$image:php$PHP-$VARIATION,$image:php$PHP-base,$image:php$PHP-prod"
          dev="$image:php$PHP-dev"
          if [ -n "$VERSION" ]; then
            runtime="$runtime,$image:php$PHP-$VARIATION-$VERSION,$image:php$PHP-base-$VERSION,$image:php$PHP-prod-$VERSION"
            dev="$dev,$image:php$PHP-dev-$VERSION"
            if [ "$PHP" = "8.5" ]; then runtime="$runtime,$image:latest"; fi
          fi
          echo "RUNTIME_TAGS=$runtime" >> "$GITHUB_ENV"
          echo "DEV_TAGS=$dev" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Push without tags. Only the digest that passes the checks below gets the tags,
      # so the tested and scanned bytes are exactly the ones published.
      - name: Build and push the runtime image by digest
        id: runtime
        uses: docker/build-push-action@v7.4.0
        with:
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            BASE_VARIATION=${{ inputs.php-variation }}
          context: src/.
          platforms: linux/amd64,linux/arm64/v8
          pull: true
          provenance: mode=max
          sbom: true
          outputs: type=image,name=laravoltdev/image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=php${{ matrix.php-version }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php-version }}

      - name: Pull both architectures of that digest
        env:
          REF: laravoltdev/image@${{ steps.runtime.outputs.digest }}
        run: .github/scripts/pull-platforms.sh "$REF" laravolt-image

      - name: Smoke test (amd64)
        run: .github/scripts/smoke-test.sh laravolt-image-amd64 ${{ matrix.php-version }}

      - name: Install Trivy
        run: .github/scripts/install-trivy.sh

      # A critical vulnerability that has a fix stops the tagging, on either architecture.
      - name: Scan for vulnerabilities (amd64)
        run: .github/scripts/scan.sh laravolt-image-amd64 trivy-php${{ matrix.php-version }}.sarif

      - name: Scan for vulnerabilities (arm64)
        run: .github/scripts/scan.sh laravolt-image-arm64

      - name: Upload the scan to the Security tab
        if: always() && hashFiles(format('trivy-php{0}.sarif', matrix.php-version)) != ''
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: trivy-php${{ matrix.php-version }}.sarif
          category: trivy-php${{ matrix.php-version }}

      - name: Tag the verified runtime image
        env:
          DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          args=()
          IFS=',' read -ra tags <<< "$RUNTIME_TAGS"
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "laravoltdev/image@$DIGEST"

      # The dev image builds on the verified runtime digest, not on a tag that another run could move.
      - name: Build and push the dev image by digest
        id: dev
        uses: docker/build-push-action@v7.4.0
        with:
          build-args: |
            BASE_IMAGE=laravoltdev/image@${{ steps.runtime.outputs.digest }}
          context: src/.
          file: src/dev.Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          pull: true
          provenance: mode=max
          sbom: true
          outputs: type=image,name=laravoltdev/image,push-by-digest=true,name-canonical=true,push=true

      - name: Scan the dev image (amd64 and arm64)
        env:
          REF: laravoltdev/image@${{ steps.dev.outputs.digest }}
        run: |
          .github/scripts/pull-platforms.sh "$REF" laravolt-dev
          .github/scripts/scan.sh laravolt-dev-amd64
          .github/scripts/scan.sh laravolt-dev-arm64

      - name: Tag the verified dev image
        env:
          DIGEST: ${{ steps.dev.outputs.digest }}
        run: |
          args=()
          IFS=',' read -ra tags <<< "$DEV_TAGS"
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "laravoltdev/image@$DIGEST"
